name: Build Desktop Installers
run-name: Desktop installers - ${{ github.ref_name }} (${{ github.event_name }})

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            python scripts/release_metadata.py --tag "$RELEASE_TAG"
          else
            python scripts/release_metadata.py
          fi
      - run: python scripts/fetch_novnc.py
      - run: python -m pip install '.[dev]'
      - run: python -m pip install '.[desktop]'
      - run: python -m unittest discover -s tests -v
      - run: ruff check .

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x86_64
          - os: windows-2022
            arch: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install NSIS and QEMU (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install nsis --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          choco install qemu --version=2026.8.11 --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'QEMU installation failed' }
          "ANDROIDBOX_QEMU_PREFIX=C:\Program Files\qemu" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install Linux packaging, Qt and QEMU prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          if [ "${{ matrix.arch }}" = aarch64 ]; then
            sudo apt-get install -y qemu-system-aarch64 qemu-efi-aarch64 libegl1 libopengl0 libxkbcommon0 libnss3 libasound2t64 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 desktop-file-utils
          else
            sudo apt-get install -y qemu-system-x86 libegl1 libopengl0 libxkbcommon0 libnss3 libasound2 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 desktop-file-utils
          fi
          desktop-file-validate packaging/androidbox-appimage.desktop
          python scripts/fetch_appimagetool.py --arch ${{ matrix.arch }}
          echo "ANDROIDBOX_QEMU_PREFIX=/usr" >> "$GITHUB_ENV"
      - name: Install QEMU (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install qemu
          echo "ANDROIDBOX_QEMU_PREFIX=$(brew --prefix qemu)" >> "$GITHUB_ENV"
      - name: Fetch Android Platform Tools
        run: python scripts/fetch_platform_tools.py
      - name: Select bundled ADB path (Unix)
        if: runner.os != 'Windows'
        run: echo "ANDROIDBOX_ADB_DIRECTORY=$GITHUB_WORKSPACE/build/platform-tools" >> "$GITHUB_ENV"
      - name: Select bundled ADB path (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "ANDROIDBOX_ADB_DIRECTORY=$env:GITHUB_WORKSPACE\build\platform-tools" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - run: python scripts/fetch_novnc.py
      - run: python -m pip install '.[desktop,build]'
      - name: Native host unit tests
        run: python -m unittest discover -s tests -v
      - name: Qt smoke test
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        run: python scripts/smoke_desktop.py
      - run: python -m PyInstaller packaging/desktop.spec --noconfirm
      - name: Verify frozen macOS application
        if: runner.os == 'macOS'
        run: python scripts/verify_frozen.py dist/AndroidBox.app/Contents/MacOS/AndroidBox --require-runtime
      - name: Verify frozen Windows application
        if: runner.os == 'Windows'
        run: python scripts/verify_frozen.py dist/AndroidBox/AndroidBox.exe --require-runtime
      - name: Verify frozen Linux application
        if: runner.os == 'Linux'
        run: python scripts/verify_frozen.py dist/AndroidBox/AndroidBox --require-runtime
      - name: Create NSIS or signed DMG
        if: runner.os != 'Linux'
        run: python scripts/package_desktop.py --arch ${{ matrix.arch }}
      - name: Create AppImage
        if: runner.os == 'Linux'
        run: python scripts/package_desktop.py --appimagetool build/appimagetool.AppImage --arch ${{ matrix.arch }}
      - name: Create portable tar.gz
        shell: bash
        run: |
          set -euo pipefail
          version=$(python scripts/release_metadata.py)
          case "${{ matrix.os }}" in
            windows-2022) payload=dist/AndroidBox; os_name=Windows; arch=x86_64 ;;
            macos-15-intel) payload=dist/AndroidBox.app; os_name=macOS; arch=x86_64 ;;
            macos-15) payload=dist/AndroidBox.app; os_name=macOS; arch=arm64 ;;
            ubuntu-22.04) payload=dist/AndroidBox; os_name=Linux; arch=x86_64 ;;
            ubuntu-24.04-arm) payload=dist/AndroidBox; os_name=Linux; arch=aarch64 ;;
          esac
          tar -czf "dist/installers/AndroidBox-$version-$os_name-$arch.tar.gz" -C dist "$(basename "$payload")"
      - name: Verify mounted DMG
        if: runner.os == 'macOS'
        run: python scripts/verify_frozen.py --dmg dist/installers/*.dmg --require-runtime
      - name: Verify installed Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = (Get-ChildItem dist/installers/*-Setup.exe).FullName
          $install = Join-Path $env:RUNNER_TEMP 'AndroidBox Install Test'
          # NSIS consumes the rest of the command line; /D= and _?= must be last and unquoted.
          $process = Start-Process -FilePath $installer -ArgumentList "/S /D=$install" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS install failed: $($process.ExitCode)" }
          try {
            $entry = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\AndroidBox'
            if ($entry.UninstallString -ne "`"$install\Uninstall.exe`"") { throw 'Invalid registered uninstall command' }
            if ($entry.QuietUninstallString -ne "`"$install\Uninstall.exe`" /S") { throw 'Invalid registered silent uninstall command' }
            python scripts/verify_frozen.py "$install/AndroidBox.exe" --require-runtime
            if ($LASTEXITCODE -ne 0) { throw 'Installed application verification failed' }
          } finally {
            $process = Start-Process -FilePath "$install/Uninstall.exe" -ArgumentList "/S _?=$install" -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "NSIS uninstall failed: $($process.ExitCode)" }
          }
      - name: Verify AppImage extraction
        if: runner.os == 'Linux'
        run: |
          version=$(python scripts/release_metadata.py)
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/dist/installers/AndroidBox-$version-Linux-${{ matrix.arch }}.AppImage" --appimage-extract
          test -x squashfs-root/AppRun
          test -x squashfs-root/usr/lib/androidbox/AndroidBox
          python "$GITHUB_WORKSPACE/scripts/verify_frozen.py" "$RUNNER_TEMP/squashfs-root/AppRun" --require-runtime
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: dist/installers/*
          if-no-files-found: error
          compression-level: 0

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [validate, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: release-assets
      - name: Validate complete release and calculate checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/release_metadata.py --tag "$RELEASE_TAG" --checksums release-assets
      - name: Stage complete Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json; then
            python -c 'import json; assert json.load(open("release-state.json"))["isDraft"], "Refusing to replace an already-published release"'
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "AndroidBox $RELEASE_TAG" --notes-file packaging/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false
