name: Build Desktop Installers
run-name: Desktop installers - ${{ github.ref_name }} (${{ github.event_name }})

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          # QtMultimedia cannot import without the PulseAudio client library, which
          # leaves the camera stack inert and its tests erroring on this runner.
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libnss3 libasound2 libpulse0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxkbcommon-x11-0 libxcb-shape0 libxcb-xkb1 libminizip1
      - name: Validate version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            python scripts/release_metadata.py --tag "$RELEASE_TAG"
          else
            python scripts/release_metadata.py
          fi
      - run: python scripts/fetch_novnc.py
      - run: python -m pip install '.[dev,desktop]'
      - name: Unit tests including the Qt guest disk flow
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        run: python -m unittest discover -s tests -v
      - run: ruff check .

  images:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install disk image tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y e2fsprogs
      - name: Build the bundled Android image disk
        run: |
          set -euo pipefail
          python scripts/build_system_images.py --arch ${{ matrix.arch }} \
            --output "dist-images/androidbox-images-${{ matrix.arch }}.raw"
      - uses: actions/upload-artifact@v4
        with:
          name: androidbox-images-${{ matrix.arch }}
          path: dist-images/*.raw
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  build:
    needs: [validate, images]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x86_64
            images: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
            images: aarch64
          - os: macos-15
            arch: arm64
            images: aarch64
          - os: macos-15-intel
            arch: x86_64
            images: x86_64
          - os: windows-2022
            arch: x86_64
            images: x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install platform prerequisites
        shell: bash
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in
            Linux)
              sudo apt-get update
              shared=(libegl1 libopengl0 libxkbcommon0 libnss3 libxcb-cursor0 libxcb-icccm4
                     libxcb-image0 libxcb-keysyms1 libxcb-render-util0 desktop-file-utils)
              # PyInstaller bundles only what it can resolve on the analysis host,
              # so the xcb platform plugin needs these present to reach the AppImage.
              shared+=(libxkbcommon-x11-0 libxcb-shape0 libxcb-xkb1)
              # Without the PulseAudio client library QtMultimedia fails to import
              # during analysis, and the frozen Linux build ships no camera at all.
              shared+=(libpulse0)
              if [ "${{ matrix.arch }}" = aarch64 ]; then
                # Google publishes no AArch64 Linux Platform Tools archive, so the ARM
                # build stages the distribution's own ADB plus its shared libraries.
                # Shipping the x86_64 binary would leave an ADB that end users cannot
                # execute and that shadows their system copy.
                # libasound2 and libminizip1 gained the t64 suffix on Ubuntu 24.04 ARM.
                sudo apt-get install -y "${shared[@]}" qemu-system-aarch64 qemu-efi-aarch64 \
                  libasound2t64 libminizip1t64 adb patchelf
              else
                sudo apt-get install -y "${shared[@]}" qemu-system-x86 libasound2 libminizip1
              fi
              desktop-file-validate packaging/androidbox-appimage.desktop
              python scripts/fetch_appimagetool.py --arch ${{ matrix.arch }}
              echo 'ANDROIDBOX_QEMU_PREFIX=/usr' >> "$GITHUB_ENV"
              ;;
            macOS)
              brew install qemu
              echo "ANDROIDBOX_QEMU_PREFIX=$(brew --prefix qemu)" >> "$GITHUB_ENV"
              ;;
            Windows)
              powershell -NoProfile -ExecutionPolicy Bypass -File scripts/install_qemu_windows.ps1 -IncludeNsis
              echo 'ANDROIDBOX_QEMU_PREFIX=C:\Program Files\qemu' >> "$GITHUB_ENV"
              ;;
          esac
      - name: Fetch Android Platform Tools
        run: python scripts/fetch_platform_tools.py
      - name: Select bundled ADB path
        shell: bash
        run: echo "ANDROIDBOX_ADB_DIRECTORY=$GITHUB_WORKSPACE/build/platform-tools" >> "$GITHUB_ENV"
      - name: Download the bundled Android image disk
        uses: actions/download-artifact@v4
        with:
          pattern: androidbox-images-*
          merge-multiple: true
          path: images
      - name: Select the bundled Android image disk
        shell: bash
        # macOS labels the machine arm64 while the guest disk is named after the
        # architecture QEMU runs, which the matrix carries separately.
        run: echo "ANDROIDBOX_IMAGES_RAW=$GITHUB_WORKSPACE/images/androidbox-images-${{ matrix.images }}.raw" >> "$GITHUB_ENV"
      - run: python scripts/fetch_novnc.py
      - run: python -m pip install '.[desktop,build]'
      - run: python -m PyInstaller packaging/desktop.spec --noconfirm
      - name: Verify frozen application
        shell: bash
        run: |
          set -euo pipefail
          case "${{ runner.os }}" in
            macOS) target='dist/AndroidBox.app/Contents/MacOS/AndroidBox' ;;
            Windows) target='dist/AndroidBox/AndroidBox.exe' ;;
            *) target='dist/AndroidBox/AndroidBox' ;;
          esac
          python scripts/verify_frozen.py "$target" --require-runtime --require-images
      - name: Create installer
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ runner.os }}" = Linux ]; then
            python scripts/package_desktop.py --appimagetool build/appimagetool.AppImage --arch ${{ matrix.arch }}
          elif [ "${{ runner.os }}" = Windows ]; then
            # The Android system image rides appended to the installer: makensis
            # cannot compress the multi-gigabyte disk into its database.
            python scripts/package_desktop.py --arch ${{ matrix.arch }} --images-raw "$ANDROIDBOX_IMAGES_RAW"
          else
            python scripts/package_desktop.py --arch ${{ matrix.arch }}
          fi
      - name: Create portable tar.gz
        shell: bash
        run: |
          set -euo pipefail
          version=$(python scripts/release_metadata.py)
          case "${{ matrix.os }}" in
            windows-2022) payload=dist/AndroidBox; os_name=Windows; arch=x86_64 ;;
            macos-15-intel) payload=dist/AndroidBox.app; os_name=macOS; arch=x86_64 ;;
            macos-15) payload=dist/AndroidBox.app; os_name=macOS; arch=arm64 ;;
            ubuntu-22.04) payload=dist/AndroidBox; os_name=Linux; arch=x86_64 ;;
            ubuntu-24.04-arm) payload=dist/AndroidBox; os_name=Linux; arch=aarch64 ;;
          esac
          tar -czf "dist/installers/AndroidBox-$version-$os_name-$arch.tar.gz" -C dist "$(basename "$payload")"
      - name: Verify mounted DMG
        if: runner.os == 'macOS'
        run: python scripts/verify_frozen.py --dmg dist/installers/*.dmg --require-runtime --require-images
      - name: Verify installed Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = (Get-ChildItem dist/installers/*-Setup.exe).FullName
          $install = Join-Path $env:RUNNER_TEMP 'AndroidBox Install Test'
          # NSIS consumes the rest of the command line; /D= and _?= must be last and unquoted.
          $process = Start-Process -FilePath $installer -ArgumentList "/S /D=$install" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS install failed: $($process.ExitCode)" }
          try {
            $entry = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\AndroidBox'
            if ($entry.UninstallString -ne "`"$install\Uninstall.exe`"") { throw 'Invalid registered uninstall command' }
            if ($entry.QuietUninstallString -ne "`"$install\Uninstall.exe`" /S") { throw 'Invalid registered silent uninstall command' }
            python scripts/verify_frozen.py "$install/AndroidBox.exe" --require-runtime --require-images
            if ($LASTEXITCODE -ne 0) { throw 'Installed application verification failed' }
          } finally {
            $process = Start-Process -FilePath "$install/Uninstall.exe" -ArgumentList "/S _?=$install" -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "NSIS uninstall failed: $($process.ExitCode)" }
          }
      - name: Verify AppImage extraction
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          version=$(python scripts/release_metadata.py)
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/dist/installers/AndroidBox-$version-Linux-${{ matrix.arch }}.AppImage" --appimage-extract
          test -x squashfs-root/AppRun
          test -x squashfs-root/usr/lib/androidbox/AndroidBox
          python "$GITHUB_WORKSPACE/scripts/verify_frozen.py" "$RUNNER_TEMP/squashfs-root/AppRun" --require-runtime --require-images
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: dist/installers/*
          if-no-files-found: error
          compression-level: 0

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [validate, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: release-assets
      - name: Validate complete release and calculate checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/release_metadata.py --tag "$RELEASE_TAG" --checksums release-assets
      - name: Stage complete Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json; then
            python -c 'import json; assert json.load(open("release-state.json"))["isDraft"], "Refusing to replace an already-published release"'
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "AndroidBox $RELEASE_TAG" --notes-file packaging/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false
