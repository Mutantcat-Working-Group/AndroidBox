name: Build Desktop Installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Validate version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" = tag ]; then
            python scripts/release_metadata.py --tag "$RELEASE_TAG"
          else
            python scripts/release_metadata.py
          fi
      - run: python scripts/fetch_novnc.py
      - run: python -m unittest discover -s tests -v
      - run: python -m pip install '.[dev]'
      - run: ruff check .

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install NSIS
        if: runner.os == 'Windows'
        run: choco install nsis --no-progress -y
      - name: Install Linux packaging and Qt prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxkbcommon0 libnss3 libasound2 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 desktop-file-utils
          desktop-file-validate packaging/androidbox-appimage.desktop
          python scripts/fetch_appimagetool.py
      - run: python scripts/fetch_novnc.py
      - run: python -m pip install '.[desktop,build]'
      - name: Native host unit tests
        run: python -m unittest discover -s tests -v
      - name: Qt smoke test
        env:
          QT_QPA_PLATFORM: offscreen
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        run: python scripts/smoke_desktop.py
      - run: python -m PyInstaller packaging/desktop.spec --noconfirm
      - name: Verify frozen macOS application
        if: runner.os == 'macOS'
        run: python scripts/verify_frozen.py dist/AndroidBox.app/Contents/MacOS/AndroidBox
      - name: Verify frozen Windows application
        if: runner.os == 'Windows'
        run: python scripts/verify_frozen.py dist/AndroidBox/AndroidBox.exe
      - name: Verify frozen Linux application
        if: runner.os == 'Linux'
        run: python scripts/verify_frozen.py dist/AndroidBox/AndroidBox
      - name: Create NSIS or signed DMG
        if: runner.os != 'Linux'
        run: python scripts/package_desktop.py
      - name: Create AppImage
        if: runner.os == 'Linux'
        run: python scripts/package_desktop.py --appimagetool build/appimagetool.AppImage
      - name: Verify mounted DMG
        if: runner.os == 'macOS'
        run: python scripts/verify_frozen.py --dmg dist/installers/*.dmg
      - name: Verify installed Windows application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = (Get-ChildItem dist/installers/*-Setup.exe).FullName
          $install = Join-Path $env:RUNNER_TEMP 'AndroidBox Install Test'
          $process = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$install") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "NSIS install failed: $($process.ExitCode)" }
          try {
            python scripts/verify_frozen.py "$install/AndroidBox.exe"
            if ($LASTEXITCODE -ne 0) { throw 'Installed application verification failed' }
          } finally {
            $process = Start-Process -FilePath "$install/Uninstall.exe" -ArgumentList @('/S', "_?=$install") -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw "NSIS uninstall failed: $($process.ExitCode)" }
          }
      - name: Verify AppImage extraction
        if: runner.os == 'Linux'
        run: |
          version=$(python scripts/release_metadata.py)
          cd "$RUNNER_TEMP"
          "$GITHUB_WORKSPACE/dist/installers/AndroidBox-$version-Linux-x86_64.AppImage" --appimage-extract
          test -x squashfs-root/AppRun
          test -x squashfs-root/usr/lib/androidbox/AndroidBox
          python "$GITHUB_WORKSPACE/scripts/verify_frozen.py" "$RUNNER_TEMP/squashfs-root/AppRun"
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: dist/installers/*
          if-no-files-found: error
          compression-level: 0

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [validate, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: release-assets
      - name: Validate complete release and calculate checksums
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/release_metadata.py --tag "$RELEASE_TAG" --checksums release-assets
      - name: Stage complete Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json; then
            python -c 'import json; assert json.load(open("release-state.json"))["isDraft"], "Refusing to replace an already-published release"'
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "AndroidBox $RELEASE_TAG" --notes-file packaging/release-notes.md
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" --draft=false
