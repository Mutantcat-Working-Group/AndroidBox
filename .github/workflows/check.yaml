# SPDX-License-Identifier: GPL-3.0-or-later

name: Check Python Package

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  actions: read
  contents: read
  security-events: write

jobs:

  portable-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python scripts/fetch_novnc.py
      - run: python -m unittest discover -s tests -v
      - run: python -m pip wheel --no-deps . --wheel-dir dist

  qemu-display:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install QEMU and Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 libegl1 libopengl0 libxkbcommon0 libnss3 libasound2t64
      - name: Install QEMU (macOS)
        if: runner.os == 'macOS'
        run: brew install qemu
      - name: Install QEMU (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install qemu --no-progress -y
          "C:\Program Files\qemu" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - run: python scripts/fetch_novnc.py
      - run: python -m pip install '.[desktop]'
      - name: Test Qt window and disconnected display
        run: python scripts/smoke_desktop.py --screenshot desktop.png
      - name: Test real authenticated QEMU framebuffer and shutdown
        run: python scripts/smoke_qemu.py --screenshot qemu.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: display-${{ matrix.os }}
          path: '*.png'

  code-ql:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-and-quality
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: pip install ruff
      - name: Run linter
        run: ruff check --output-format=github
