[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "androidbox"
version = "1.0.20260927"
description = "AndroidBox cross-platform QEMU desktop client"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
readme = "README.md"

[project.optional-dependencies]
desktop = ["PySide6>=6.8,<7", "certifi>=2024"]
dev = ["ruff>=0.11"]
build = ["pyinstaller>=6.12,<7"]

[project.gui-scripts]
androidbox-desktop = "androidbox.__main__:main"

[tool.setuptools.packages.find]
include = ["androidbox*"]

[tool.setuptools.package-data]
androidbox = ["web/**/*", "web/*", "assets/*"]

[tool.autopep8]
max-line-length = 131

[tool.isort]
line_length = 131

[tool.ruff]
line-length = 131

[tool.ruff.lint]
select = [
	# Standard errors and warnings
	"E",
	"W",
	"F",
]
ignore = [
	"E501", # Do not enforce line length limit for now.
	"F401", # TODO: Remove this once unused imports are removed.
	"F811", # TODO: Remove this once redefined variables are refactored.
]
